name: Chitra
options:
  bundleIdPrefix: com.buildapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Chitra:
    type: application
    platform: iOS
    sources:
      - path: Chitra
      # The app icon lives outside the compiled sources on purpose. actool
      # refuses to compile any asset catalog when the newest installed
      # simulator runtime is older than the SDK ("No simulator runtime version
      # from [...] available to use with iphonesimulator SDK version ..."),
      # which is the case with Xcode 26.6 + an iOS 18.6 runtime. Install a
      # simulator runtime matching the SDK, then uncomment these three lines
      # (and the two ASSETCATALOG_ settings below) to ship the icon.
      # - path: AppIcon.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildapp.photos
        PRODUCT_NAME: Chitra
        INFOPLIST_FILE: Chitra/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: libsqlite3.tbd

  ChitraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChitraTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buildapp.photos.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chitra

schemes:
  Chitra:
    build:
      targets:
        Chitra: all
        ChitraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChitraTests
