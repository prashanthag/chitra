<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e10" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Chitra" />
<link rel="manifest" href="/static/manifest.json" />
<link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
<link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
<title>Chitra</title>
<style>
  :root { color-scheme: dark; --bg:#0e0e10; --panel:#161619; --panel2:#1e1e22;
          --line:#262629; --txt:#eee; --dim:#9a9aa2; --accent:#5b8cff; }
  * { box-sizing: border-box; }
  html,body { height:100%; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--txt); }
  a { color:inherit; }

  /* layout */
  #app { display:grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr;
         grid-template-areas: "head head" "side main"; height:100vh; }
  header { grid-area:head; display:flex; align-items:center; gap:14px; padding:0 18px;
           border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:30; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  header .grow { margin-left:auto; }
  .pill { background:var(--panel2); padding:4px 10px; border-radius:999px; font-size:12px; color:var(--dim); }
  .btn { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
         padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:#3a3a40; }
  .btn.accent { background:var(--accent); border-color:var(--accent); color:#fff; }

  nav { grid-area:side; border-right:1px solid var(--line); background:var(--panel);
        padding:10px 8px; overflow:auto; }
  nav .item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px;
              cursor:pointer; color:var(--dim); font-size:14px; }
  nav .item:hover { background:var(--panel2); color:var(--txt); }
  nav .item.active { background:var(--panel2); color:var(--txt); font-weight:600; }
  nav .item .ic { width:18px; text-align:center; }
  nav .sep { height:1px; background:var(--line); margin:8px 6px; }
  nav .label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:#67676f; padding:8px 12px 4px; }

  main { grid-area:main; overflow:auto; position:relative; }
  #searchbar { display:none; padding:14px 18px 0; }
  #searchbar.on { display:block; }
  #searchbar input { width:100%; max-width:520px; background:var(--panel2); border:1px solid var(--line);
        color:var(--txt); padding:10px 14px; border-radius:10px; font-size:14px; }
  .crumb { padding:14px 18px 4px; color:var(--dim); font-size:13px; display:flex; align-items:center; gap:8px; }
  .crumb b { color:var(--txt); }

  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap:4px; padding:8px; }
  .mhead { grid-column: 1 / -1; padding:20px 8px 6px; font-size:16px; font-weight:600;
          position:sticky; top:0; z-index:5;
          background:linear-gradient(var(--bg) 72%, transparent); }
  .mhead:first-child { padding-top:8px; }
  .tile { position:relative; aspect-ratio:1; background:var(--panel2); cursor:pointer;
          overflow:hidden; border-radius:4px; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .2s; }
  .tile:hover img { transform:scale(1.04); }
  .tile .badge { position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,.65);
          padding:2px 7px; border-radius:5px; font-size:11px; }
  .tile .fav { position:absolute; top:5px; right:7px; font-size:14px; color:#ffd24a;
          text-shadow:0 1px 3px #000; }
  .tile .sel { position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%;
          background:rgba(0,0,0,.45); border:2px solid #fff; color:transparent; font-size:13px;
          line-height:18px; text-align:center; cursor:pointer; opacity:0; transition:opacity .15s; z-index:2; }
  .tile:hover .sel, #grid.selecting .tile .sel { opacity:1; }
  .tile.selected .sel { background:var(--accent); border-color:var(--accent); color:#fff; opacity:1; }
  .tile.selected img { transform:scale(.86); border-radius:10px; }

  /* selection action bar */
  #selbar { position:sticky; top:0; z-index:40; display:none; align-items:center; gap:10px;
          padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  #selbar.on { display:flex; }
  #selbar .cnt { font-size:14px; font-weight:600; }
  .btn.danger { background:#3a1518; border-color:#5c2226; color:#ff8a8a; }
  .btn.danger:hover { border-color:#a03338; }

  /* people / album cards */
  #cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:14px; padding:18px; }
  .card { cursor:pointer; }
  .card .av { width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; background:var(--panel2);
          border:2px solid var(--line); }
  .card .sq { width:100%; aspect-ratio:1; border-radius:10px; object-fit:cover; background:var(--panel2); }
  .card .nm { margin-top:8px; font-size:13px; text-align:center; }
  .card .ct { font-size:11px; color:var(--dim); text-align:center; }
  .card .ct .rn { color:var(--dim); text-decoration:underline; text-underline-offset:2px; }
  .card .ct .rn:hover { color:var(--fg, #e8e8ea); }

  #status { padding:18px; color:var(--dim); font-size:13px; }
  #sentinel { height:1px; }

  /* viewer */
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.96); display:none; z-index:100; }
  #viewer.on { display:flex; align-items:center; justify-content:center; }
  #viewer .stage { max-width:100vw; max-height:100vh; display:flex; align-items:center; justify-content:center; }
  #viewer img, #viewer video { max-width:94vw; max-height:88vh; border-radius:6px; }
  #viewer .top { position:absolute; top:0; left:0; right:0; display:flex; gap:10px; align-items:center;
          padding:14px 18px; background:linear-gradient(rgba(0,0,0,.6), transparent); }
  #viewer .top .grow { margin-left:auto; }
  #viewer .nav-arrow { position:absolute; top:50%; transform:translateY(-50%); font-size:40px;
          color:#fff; cursor:pointer; padding:10px 18px; user-select:none; opacity:.6; }
  #viewer .nav-arrow:hover { opacity:1; }
  #prev { left:6px; } #next { right:6px; }
  .iconbtn { background:rgba(255,255,255,.1); border:0; color:#fff; width:38px; height:38px;
          border-radius:50%; cursor:pointer; font-size:16px; }
  .iconbtn:hover { background:rgba(255,255,255,.22); }
  .iconbtn.on { color:#ffd24a; }

  /* tag popover */
  #tagpop { position:absolute; top:60px; right:18px; width:260px; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; padding:12px; display:none; z-index:120; }
  #tagpop.on { display:block; }

  /* info popover */
  #infopop { position:absolute; top:60px; right:18px; width:300px; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:none; z-index:120; }
  #infopop.on { display:block; }
  #infopop h4 { margin:0 0 8px; font-size:13px; }
  #infopop .irow { display:flex; gap:10px; padding:5px 0; font-size:13px; border-top:1px solid var(--line); }
  #infopop .irow:first-child { border-top:0; }
  #infopop .ik { color:var(--dim); min-width:86px; }
  #infopop .iv { word-break:break-all; }
  #tagpop h4 { margin:0 0 10px; font-size:13px; }
  #tagpop .plist { max-height:220px; overflow:auto; margin-bottom:10px; }
  #tagpop .prow { display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px; cursor:pointer; font-size:13px; }
  #tagpop .prow:hover { background:var(--panel2); }
  #tagpop .prow .chk { margin-left:auto; color:var(--accent); }
  #tagpop .newrow { display:flex; gap:6px; }
  #tagpop input { flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
          padding:7px 9px; border-radius:8px; font-size:13px; }
  /* scroll date badge (Google-Photos style) */
  #datebadge { position:fixed; top:74px; right:30px; z-index:60; background:rgba(22,22,26,.94);
          border:1px solid var(--line); padding:8px 16px; border-radius:999px; font-size:13px;
          font-weight:600; letter-spacing:.3px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #datebadge.on { opacity:1; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2);
          border:1px solid var(--line); padding:10px 16px; border-radius:10px; font-size:13px;
          z-index:200; opacity:0; transition:opacity .2s; }
  .toast.on { opacity:1; }
  #dropzone { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center;
          background:rgba(91,140,255,.12); border:3px dashed var(--accent); margin:10px; border-radius:16px;
          font-size:22px; font-weight:600; color:#cdd9ff; pointer-events:none; }
  #dropzone.on { display:flex; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Chitra</h1>
    <span class="pill" id="count">–</span>
    <span class="pill" id="scan">–</span>
    <span class="grow"></span>
    <button class="btn accent" onclick="document.getElementById('fileInput').click()">↑ Upload</button>
    <button class="btn" onclick="rescan()">Rescan</button>
    <input id="fileInput" type="file" accept="image/*,video/*" multiple style="display:none" onchange="uploadFiles(this.files)" />
  </header>

  <nav id="nav">
    <div class="item active" data-view="photos"><span class="ic">▦</span> Photos</div>
    <div class="item" data-view="search"><span class="ic">⌕</span> Search</div>
    <div class="item" data-view="favorites"><span class="ic">★</span> Favorites</div>
    <div class="sep"></div>
    <div class="label">Library</div>
    <div class="item" data-view="people"><span class="ic">☺</span> People</div>
    <div class="item" data-view="albums"><span class="ic">▤</span> Albums</div>
    <div class="item" data-view="cameras"><span class="ic">▣</span> Cameras</div>
    <div class="item" data-view="videos"><span class="ic">▷</span> Videos</div>
    <div class="sep"></div>
    <div class="label">Unknown date</div>
    <div class="item" data-view="unknown-photos"><span class="ic">▦</span> Photos</div>
    <div class="item" data-view="unknown-videos"><span class="ic">▷</span> Videos</div>
    <div class="sep"></div>
    <div class="item" data-view="trash"><span class="ic">🗑</span> Trash</div>
  </nav>

  <main id="main">
    <div id="selbar">
      <button class="btn" title="Clear selection" onclick="clearSel()">✕</button>
      <span class="cnt" id="selCount">0 selected</span>
      <button class="btn" onclick="selectAll()">Select all</button>
      <span style="margin-left:auto"></span>
      <button class="btn danger" id="selTrash" onclick="bulkTrash()">🗑 Move to trash</button>
      <button class="btn" id="selRestore" onclick="bulkRestore()">↩ Restore</button>
      <button class="btn danger" id="selDelete" onclick="bulkDelete()">Delete forever</button>
    </div>
    <div id="searchbar"><input id="searchInput" placeholder="Search your photos — try &ldquo;beach&rdquo;, &ldquo;sunset&rdquo;, &ldquo;dog&rdquo;&hellip;" /></div>
    <div class="crumb" id="crumb" style="display:none"></div>
    <div id="cards" style="display:none"></div>
    <div id="grid"></div>
    <div id="status">Loading&hellip;</div>
    <div id="sentinel"></div>
  </main>
</div>

<div id="viewer">
  <div class="top">
    <button class="iconbtn" onclick="closeViewer()">✕</button>
    <span class="grow"></span>
    <button class="iconbtn" id="vId" title="ID / passport photo (white background)" onclick="idPhotoCurrent()">🪪</button>
    <button class="iconbtn" id="vShare" title="Share" onclick="shareCurrent()">⤴</button>
    <button class="iconbtn" id="vInfo" title="Info" onclick="toggleInfo()">ⓘ</button>
    <button class="iconbtn" id="vFav" title="Favorite" onclick="toggleFav()">★</button>
    <button class="iconbtn" id="vTag" title="Tag people" onclick="toggleTagPop()">＠</button>
    <button class="iconbtn" id="vTrash" title="Move to trash" onclick="trashCurrent()">🗑</button>
  </div>
  <div class="nav-arrow" id="prev" onclick="step(-1)">‹</div>
  <div class="stage" id="stage"></div>
  <div class="nav-arrow" id="next" onclick="step(1)">›</div>
  <div id="infopop">
    <h4>Info</h4>
    <div id="infoRows"></div>
  </div>
  <div id="tagpop">
    <h4>Tag people in this photo</h4>
    <div class="plist" id="tagList"></div>
    <div class="newrow">
      <input id="newPerson" placeholder="New person name" onkeydown="if(event.key==='Enter')addPerson()" />
      <button class="btn accent" onclick="addPerson()">Add</button>
    </div>
  </div>
</div>
<div id="datebadge"></div>
<div class="toast" id="toast"></div>
<div id="dropzone">Drop photos &amp; videos to upload</div>

<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch(p, o);
const getJSON = async (p, o) => { const r = await api(p, o); if(!r.ok) throw {status:r.status}; return r.json(); };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PER = 80;
let state = { view:'photos', page:1, loading:false, done:false, params:{}, items:[], cur:-1, gen:0, sel:new Set() };
let io;
let CLIP_OK = false;  // is smart (CLIP) search available? set from /api/health

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800); }

// ---------- navigation ----------
document.querySelectorAll('#nav .item').forEach(el=>{
  el.addEventListener('click', ()=> switchView(el.dataset.view));
});
function setActive(view){
  document.querySelectorAll('#nav .item').forEach(el=> el.classList.toggle('active', el.dataset.view===view));
}
function switchView(view, params, fromPop){
  // Bump generation so any in-flight loadGrid from the previous view is ignored,
  // and clear the loading flag so the new view can fetch immediately.
  if(!fromPop) history.pushState({view, params: params||{}}, '');
  state.gen++; state.loading=false;
  state.view = view; state.page=1; state.done=false; state.items=[]; state.params = params||{};
  state.lastMonth = '';
  state.sel.clear(); updateSelBar();
  setActive(view);
  $('#searchbar').classList.toggle('on', view==='search');
  $('#grid').innerHTML=''; $('#cards').innerHTML=''; $('#cards').style.display='none'; $('#grid').style.display='grid';
  $('#crumb').style.display='none';
  $('#status').textContent='';
  if(view==='people'){ loadPeople(); return; }
  if(view==='albums'){ loadAlbums(); return; }
  if(view==='cameras'){ loadCameras(); return; }
  if(view==='search'){ $('#status').textContent='Type to search.'; $('#searchInput').focus(); return; }
  loadGrid(true);
}

// ---------- main media grid (infinite scroll) ----------
function viewParams(p){
  const v = state.view;
  if(v==='favorites') p.set('favorites','1');
  if(v==='videos') p.set('kind','video');
  if(v==='trash') p.set('trashed','1');
  // Photos/Videos show only dated items; undated live in the Unknown section.
  if(v==='photos' && !state.params.album && !state.params.camera) p.set('dated','1');
  if(v==='videos') p.set('dated','1');
  if(v==='unknown-photos'){ p.set('undated','1'); p.set('kind','photo'); }
  if(v==='unknown-videos'){ p.set('undated','1'); p.set('kind','video'); }
  Object.entries(state.params).forEach(([k,val])=> p.set(k,val));
  return p;
}
function gridQuery(){
  return '/api/media?'+viewParams(new URLSearchParams({ page:state.page, per_page:PER }));
}
async function loadGrid(reset){
  if(state.loading || state.done) return;
  state.loading = true;
  const gen = state.gen;
  try{
    const data = await getJSON(gridQuery());
    if(gen !== state.gen) return;  // view changed mid-flight; discard
    if(reset){ $('#count').textContent = data.total+' items'; }
    appendTiles(data.items);
    state.items.push(...data.items);
    state.page++;
    if(data.items.length < PER) state.done = true;
    $('#status').textContent = state.items.length ? (state.done? state.items.length+' shown':'') : 'Nothing here yet.';
  }catch(e){ $('#status').textContent = 'Failed to load ('+(e.status||e)+').'; }
  state.loading=false;
}
function tileHTML(m, idx){
  const fav = m.favorite? '<span class="fav">★</span>':'';
  const badge = m.kind==='video'? '<span class="badge">▷</span>':'';
  const on = state.sel.has(m.id)? ' selected':'';
  const ts = m.taken_at || '';
  return `<div class="tile${on}" data-idx="${idx}" data-id="${esc(m.id)}" data-ts="${ts}">
    <img loading="lazy" src="/api/media/${m.id}/thumb" alt="${esc(m.name)}"/><span class="sel">✓</span>${fav}${badge}</div>`;
}
function monthKey(m){
  // Label only from the real capture date — a missing date is "unknown",
  // never the file date (which is recovery/copy time, not when it was shot).
  if(!m.taken_at) return 'Date unknown';
  const d = new Date(m.taken_at*1000);
  return isNaN(d)? 'Date unknown' : d.toLocaleString(undefined, {month:'long', year:'numeric'});
}
function appendTiles(items){
  // Tile index = its position in state.items, derived from how many tiles already exist.
  const grid = $('#grid');
  const offset = grid.querySelectorAll('.tile').length;
  const withHeaders = state.view !== 'search' && !state.view.startsWith('unknown');
  let html = '';
  items.forEach((m,i)=>{
    if(withHeaders){
      const mk = monthKey(m);
      if(mk && mk !== state.lastMonth){ state.lastMonth = mk; html += `<div class="mhead">${esc(mk)}</div>`; }
    }
    html += tileHTML(m, offset+i);
  });
  const frag = document.createElement('div');
  frag.innerHTML = html;
  [...frag.children].forEach(el=>{
    if(el.classList.contains('tile')){
      el.addEventListener('click', ev=>{
        if(ev.target.classList.contains('sel') || state.sel.size){ toggleSel(el); return; }
        openViewer(parseInt(el.dataset.idx,10));
      });
    }
    grid.appendChild(el);
  });
}

// ---------- multi-select & bulk actions ----------
function toggleSel(el){
  const id = el.dataset.id;
  if(state.sel.has(id)){ state.sel.delete(id); el.classList.remove('selected'); }
  else { state.sel.add(id); el.classList.add('selected'); }
  updateSelBar();
}
function updateSelBar(){
  const n = state.sel.size;
  $('#selbar').classList.toggle('on', n>0);
  $('#grid').classList.toggle('selecting', n>0);
  $('#selCount').textContent = n+' selected';
  const inTrash = state.view==='trash';
  $('#selTrash').style.display = inTrash? 'none':'';
  $('#selRestore').style.display = inTrash? '':'none';
  $('#selDelete').style.display = inTrash? '':'none';
}
function markTiles(){
  document.querySelectorAll('#grid .tile').forEach(el=>
    el.classList.toggle('selected', state.sel.has(el.dataset.id)));
}
function clearSel(){ state.sel.clear(); markTiles(); updateSelBar(); }
async function selectAll(){
  if(state.view==='collection'){
    state.items.forEach(m=> state.sel.add(m.id));
  }else{
    // Walk every page of the current view so selection covers items
    // that infinite scroll hasn't rendered yet.
    let page = 1;
    while(true){
      const d = await getJSON('/api/media?'+viewParams(new URLSearchParams({page, per_page:200})));
      d.items.forEach(m=> state.sel.add(m.id));
      if(d.items.length < 200) break;
      page++;
    }
  }
  markTiles(); updateSelBar();
  toast(state.sel.size+' selected');
}
const idsPost = ids => ({method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})});
function reloadView(){
  const v = state.view==='collection'? 'photos' : state.view;
  switchView(v, state.params); refreshHealth();
}
async function bulkTrash(){
  const n = state.sel.size; if(!n) return;
  if(!confirm(`Move ${n} item${n>1?'s':''} to trash?`)) return;
  try{
    await getJSON('/api/media/batch_trash', idsPost([...state.sel]));
    toast(`Moved ${n} to trash`); reloadView();
  }catch(e){ toast('Failed ('+(e.status||e)+')'); }
}
async function bulkRestore(){
  const n = state.sel.size; if(!n) return;
  try{
    await getJSON('/api/media/batch_restore', idsPost([...state.sel]));
    toast(`Restored ${n}`); reloadView();
  }catch(e){ toast('Failed ('+(e.status||e)+')'); }
}
async function bulkDelete(){
  const n = state.sel.size; if(!n) return;
  if(!confirm(`Permanently delete ${n} item${n>1?'s':''}? Files are removed from disk — this cannot be undone.`)) return;
  try{
    const r = await getJSON('/api/media/batch_delete', idsPost([...state.sel]));
    toast(`Deleted ${r.count} forever`); reloadView();
  }catch(e){ toast('Failed ('+(e.status||e)+')'); }
}

// ---------- People ----------
async function loadPeople(){
  $('#grid').style.display='none'; $('#cards').style.display='grid'; $('#status').textContent='Loading people…';
  let clusters=[], persons=[];
  try{ clusters = await getJSON('/api/clusters'); }catch(e){}
  try{ persons = await getJSON('/api/persons'); }catch(e){}
  const cards = [];
  persons.filter(p=>p.count>0).forEach(p=>{
    cards.push(`<div class="card" data-pid="${p.id}" data-pname="${esc(p.name)}">
      <div class="av" style="display:flex;align-items:center;justify-content:center;font-size:34px;color:#67676f">☺</div>
      <div class="nm">${esc(p.name)}</div><div class="ct">${p.count} photos</div></div>`);
  });
  clusters.forEach(c=>{
    const named = !!(c.name && c.name.trim());
    const label = named? esc(c.name) : 'Unnamed';
    cards.push(`<div class="card" data-cid="${c.id}" data-cname="${named? esc(c.name) : ''}">
      <img class="av" loading="lazy" src="/api/clusters/${c.id}/thumb"/>
      <div class="nm">${label}</div><div class="ct">${c.count} faces · <a href="#" class="rn" data-rn="${c.id}">${named? 'rename' : 'name this person'}</a></div></div>`);
  });
  $('#cards').innerHTML = cards.join('');
  $('#cards').querySelectorAll('[data-cid]').forEach(el=> el.addEventListener('click', ()=> openCluster(parseInt(el.dataset.cid,10), el.dataset.cname)));
  $('#cards').querySelectorAll('[data-rn]').forEach(el=> el.addEventListener('click', ev=>{
    ev.preventDefault(); ev.stopPropagation();   // don't also open the cluster
    renameCluster(parseInt(el.dataset.rn,10), el.closest('[data-cid]').dataset.cname);
  }));
  $('#cards').querySelectorAll('[data-pid]').forEach(el=> el.addEventListener('click', ()=> openPerson(parseInt(el.dataset.pid,10), el.dataset.pname)));
  $('#status').textContent = cards.length? '' :
    'No people yet. Run the face indexer:  PHOTO_ROOT=… .venv/bin/python face_indexer.py';
}
async function openCluster(cid, name){
  // An already-named group opens straight to its photos; only an unnamed one
  // asks for a name, and even then blank just views it.
  if(!name){ return renameCluster(cid, ''); }
  const items = await getJSON(`/api/clusters/${cid}/media`);
  showCollection(name, items);
}
async function renameCluster(cid, current){
  const name = prompt('Name this person (leave blank to just view their photos):', current || '');
  if(name === null){ return; }               // cancelled - do nothing at all
  const clean = name.trim();
  if(clean && clean !== current){
    await api(`/api/clusters/${cid}/name`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:clean})});
    toast('Saved name');
  }
  const items = await getJSON(`/api/clusters/${cid}/media`);
  showCollection(clean || current || 'Person', items);
}
async function openPerson(pid, name){
  const items = await getJSON(`/api/persons/${pid}/media`);
  showCollection(name, items);
}

// ---------- Albums ----------
async function loadAlbums(){
  $('#grid').style.display='none'; $('#cards').style.display='grid'; $('#status').textContent='Loading albums…';
  let albums=[];
  try{ albums = await getJSON('/api/albums'); }catch(e){}
  $('#cards').innerHTML = albums.map(a=>{
    const nm = a.album==='_root'? 'Library root' : a.album;
    const cover = a.cover
      ? `<img class="sq" loading="lazy" src="/api/media/${a.cover}/thumb"/>`
      : `<div class="sq" style="display:flex;align-items:center;justify-content:center;font-size:34px;color:#67676f">▤</div>`;
    return `<div class="card" data-album="${esc(a.album)}">
      ${cover}<div class="nm">${esc(nm)}</div><div class="ct">${a.count} items</div></div>`;
  }).join('');
  $('#cards').querySelectorAll('[data-album]').forEach(el=>
    el.addEventListener('click', ()=> switchView('photos', {album: el.dataset.album})));
  $('#status').textContent = albums.length? '' : 'No albums.';
}

// ---------- Cameras / Devices ----------
async function loadCameras(){
  $('#grid').style.display='none'; $('#cards').style.display='grid'; $('#status').textContent='Loading devices…';
  let cams=[];
  try{ cams = await getJSON('/api/cameras'); }catch(e){}
  $('#cards').innerHTML = cams.map(c=>{
    const cover = c.cover
      ? `<img class="sq" loading="lazy" src="/api/media/${c.cover}/thumb"/>`
      : `<div class="sq" style="display:flex;align-items:center;justify-content:center;font-size:34px;color:#67676f">▣</div>`;
    return `<div class="card" data-cam="${esc(c.key)}" data-label="${esc(c.label)}">
      ${cover}<div class="nm">${esc(c.label)}</div><div class="ct">${c.count} photos</div></div>`;
  }).join('');
  $('#cards').querySelectorAll('[data-cam]').forEach(el=>
    el.addEventListener('click', ()=> switchView('photos', {camera: el.dataset.cam})));
  $('#status').textContent = cams.length? '' :
    'No camera info found. Devices come from photo EXIF (make/model).';
}

// Show an arbitrary list of items (person / cluster results) as a grid
function showCollection(title, items){
  state.view='collection'; state.items=[]; state.done=true; state.loading=false; state.params={};
  state.lastMonth = '';
  state.sel.clear(); updateSelBar();
  setActive('');
  $('#cards').style.display='none'; $('#grid').style.display='grid'; $('#grid').innerHTML='';
  $('#crumb').style.display='flex';
  $('#crumb').innerHTML = `<span style="cursor:pointer" id="crumbBack">‹ Back</span> · <b>${esc(title)}</b> · ${items.length} photos`;
  $('#crumbBack').addEventListener('click', ()=> switchView('people'));
  state.items.push(...items); appendTiles(items);
  $('#status').textContent = items.length? '' : 'No photos.';
}

// ---------- Search (semantic, falls back to filename) ----------
let searchTimer;
$('#searchInput').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(()=> runSearch(q), 350);
});
async function runSearch(q){
  if(!q){ $('#grid').innerHTML=''; state.items=[]; $('#status').textContent='Type to search.'; return; }
  state.items=[]; state.done=true; $('#grid').innerHTML=''; $('#status').textContent='Searching…';
  // Only attempt smart (CLIP) search when the index is built; otherwise go
  // straight to filename match (avoids a guaranteed 503).
  if(CLIP_OK){
    try{
      const data = await getJSON('/api/search_semantic?q='+encodeURIComponent(q)+'&top_k=120');
      state.items.push(...data.items); appendTiles(data.items);
      $('#status').textContent = data.items.length? data.items.length+' results (smart search)' : 'No matches.';
      return;
    }catch(e){ /* fall through to filename search */ }
  }
  try{
    const data = await getJSON('/api/media?q='+encodeURIComponent(q)+'&per_page=120');
    state.items.push(...data.items); appendTiles(data.items);
    const note = CLIP_OK? '' : ' (filename match — build the CLIP index for smart search)';
    $('#status').textContent = (data.items.length? data.items.length+' results':'No matches')+note;
  }catch(e2){ $('#status').textContent='Search failed.'; }
}

// ---------- Viewer ----------
function curItem(){ return state.items[state.cur]; }
function openViewer(idx){ state.cur = idx; renderViewer(); $('#viewer').classList.add('on'); history.pushState({viewer:1}, ''); }
function closeViewer(fromPop){
  // Route through history so browser Back and the ✕ button behave the same.
  if(!fromPop && history.state && history.state.viewer){ history.back(); return; }
  $('#viewer').classList.remove('on'); $('#tagpop').classList.remove('on'); $('#infopop').classList.remove('on'); $('#stage').innerHTML='';
}
window.addEventListener('popstate', e=>{
  if($('#viewer').classList.contains('on')){ closeViewer(true); return; }
  const s = e.state || {};
  switchView(s.view || 'photos', s.params || {}, true);
});
function renderViewer(){
  const m = curItem(); if(!m) return;
  const stage = $('#stage');
  if(m.kind==='video'){
    // Safari needs a seekable (Range) source: serve the original for native
    // containers and fall back to the live transcode if it can't decode it.
    const nat = ['.mp4','.mov','.m4v'].includes(m.ext);
    const primary = nat? `/api/media/${m.id}/full` : `/api/media/${m.id}/stream.mp4`;
    stage.innerHTML = `<video controls autoplay playsinline src="${primary}"></video>`;
    if(nat){
      const v = stage.querySelector('video');
      v.addEventListener('error', ()=>{
        if(v.dataset.fb) return;
        v.dataset.fb = 1;
        v.src = `/api/media/${m.id}/stream.mp4`;
        v.play().catch(()=>{});
      });
    }
  }else{
    // Browsers render JPEG/PNG/GIF/WebP natively; everything else gets
    // converted server-side.
    const native = ['.jpg','.jpeg','.png','.gif','.webp'].includes(m.ext);
    const as = native? '' : '?as=jpeg';
    stage.innerHTML = `<img src="/api/media/${m.id}/full${as}"/>`;
  }
  $('#vFav').classList.toggle('on', !!m.favorite);
  $('#tagpop').classList.remove('on');
  $('#infopop').classList.remove('on');
  $('#prev').style.visibility = state.cur>0? 'visible':'hidden';
  $('#next').style.visibility = state.cur<state.items.length-1? 'visible':'hidden';
}
function step(d){
  const n = state.cur+d;
  if(n<0||n>=state.items.length) return;
  state.cur=n; renderViewer();
  if(!state.done && n > state.items.length-8) loadGrid(false);
}
document.addEventListener('keydown', e=>{
  if(!$('#viewer').classList.contains('on')){
    if(e.key==='Escape' && state.sel.size) clearSel();
    return;
  }
  if(e.key==='Escape') closeViewer();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
async function toggleFav(){
  const m = curItem(); if(!m) return;
  const r = await getJSON(`/api/media/${m.id}/favorite`, {method:'POST'});
  m.favorite = r.favorite? 1:0;
  $('#vFav').classList.toggle('on', !!m.favorite);
  const tile = $(`#grid .tile[data-idx="${state.cur}"]`);
  if(tile){ const old=tile.querySelector('.fav'); if(m.favorite && !old){ tile.insertAdjacentHTML('beforeend','<span class="fav">★</span>'); } else if(!m.favorite && old){ old.remove(); } }
  toast(m.favorite? 'Added to favorites':'Removed from favorites');
}
async function trashCurrent(){
  const m = curItem(); if(!m) return;
  if(!confirm('Move this item to trash?')) return;
  await api(`/api/media/${m.id}/trash`, {method:'POST'});
  toast('Moved to trash'); closeViewer(); switchView(state.view==='collection'?'photos':state.view);
}

// ---------- ID / passport photo ----------
function idPhotoCurrent(){
  const m = curItem(); if(!m) return;
  if(m.kind!=='photo'){ toast('Photos only'); return; }
  toast('Generating ID photo…');
  window.open(`/api/media/${m.id}/passport?size=600`, '_blank');
}

// ---------- Share ----------
async function shareCurrent(){
  const m = curItem(); if(!m) return;
  toast('Preparing…');
  try{
    // HEIC → JPEG so every target app can display it.
    const as = (m.ext==='.heic'||m.ext==='.heif')? '?as=jpeg' : '';
    const name = as? m.name.replace(/\.hei[cf]$/i, '.jpg') : m.name;
    const r = await fetch(`/api/media/${m.id}/full${as}`);
    if(!r.ok) throw new Error(r.status);
    const blob = await r.blob();
    const file = new File([blob], name, {type: blob.type || m.mime || 'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:name});
        return;
      }catch(e){
        if(e.name==='AbortError') return;      // user closed the sheet
        // NotAllowedError etc. (e.g. gesture expired on a big video) → download
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(a.href), 30000);
    toast('Saved to Downloads — share it from there');
  }catch(e){ toast('Share failed'); }
}

// ---------- Info panel ----------
async function toggleInfo(){
  const pop = $('#infopop');
  if(pop.classList.contains('on')){ pop.classList.remove('on'); return; }
  const m = curItem(); if(!m) return;
  let d = m;
  try{ d = await getJSON(`/api/media/${m.id}`); }catch(e){}
  const fmtDate = t => t? new Date(t*1000).toLocaleString(undefined,
      {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : null;
  const fmtSize = b => b==null? null : (b>=1e9? (b/1e9).toFixed(2)+' GB' : b>=1e6? (b/1e6).toFixed(1)+' MB' : Math.round(b/1e3)+' KB');
  const cam = [d.camera_make, d.camera_model].filter(Boolean).join(' ') || null;
  const rows = [
    ['Name', d.name],
    ['Date taken', fmtDate(d.taken_at)],
    ['Camera', cam],
    ['Resolution', d.width&&d.height? `${d.width} × ${d.height}` : null],
    ['Type', [(d.kind||''), (d.ext||'').replace('.','').toUpperCase()].filter(Boolean).join(' · ')],
    ['Size', fmtSize(d.size)],
    ['Folder', d.album],
    ['Place', d.place],
    ['Location', d.lat!=null&&d.lng!=null? `${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}` : null],
    ['File date', fmtDate(d.mtime)],
  ].filter(r=> r[1]);
  $('#infoRows').innerHTML = rows.map(([k,v])=>
    `<div class="irow"><span class="ik">${esc(k)}</span><span class="iv">${esc(v)}</span></div>`).join('');
  $('#tagpop').classList.remove('on');
  pop.classList.add('on');
}

// ---------- Tagging ----------
async function toggleTagPop(){
  const pop = $('#tagpop');
  if(pop.classList.contains('on')){ pop.classList.remove('on'); return; }
  await renderTagList(); pop.classList.add('on');
}
async function renderTagList(){
  const m = curItem(); if(!m) return;
  let persons=[]; try{ persons = await getJSON('/api/persons'); }catch(e){}
  m._tags = m._tags || new Set();
  $('#tagList').innerHTML = persons.map(p=>`
    <div class="prow" data-pid="${p.id}">${esc(p.name)} <span class="chk">${m._tags.has(p.id)?'✓':''}</span></div>`).join('')
    || '<div style="color:var(--dim);font-size:12px">No people yet — add one below.</div>';
  $('#tagList').querySelectorAll('[data-pid]').forEach(el=>
    el.addEventListener('click', ()=> togglePersonTag(parseInt(el.dataset.pid,10), el)));
}
async function togglePersonTag(pid, el){
  const m = curItem(); if(!m) return;
  m._tags = m._tags || new Set();
  const has = m._tags.has(pid);
  await api(`/api/persons/${pid}/tag/${m.id}`, {method: has?'DELETE':'POST'});
  if(has){ m._tags.delete(pid); el.querySelector('.chk').textContent=''; }
  else { m._tags.add(pid); el.querySelector('.chk').textContent='✓'; }
  toast(has?'Untagged':'Tagged');
}
async function addPerson(){
  const inp = $('#newPerson'); const name = inp.value.trim(); if(!name) return;
  const p = await getJSON('/api/persons', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  inp.value='';
  const m = curItem();
  if(m && p && p.id){ await api(`/api/persons/${p.id}/tag/${m.id}`, {method:'POST'}); m._tags=m._tags||new Set(); m._tags.add(p.id); }
  await renderTagList();
  toast('Added & tagged '+name);
}

// ---------- header / health / scan polling ----------
async function refreshHealth(){
  try{
    const h = await getJSON('/api/health');
    $('#count').textContent = h.items_indexed+' items';
    CLIP_OK = (h.clip_indexed||0) > 0;
    const s = h.scan||{};
    $('#scan').textContent = s.running? `scanning ${s.scanned||0}/${s.total_seen||0}` : 'idle';
    return s.running;
  }catch(e){ $('#scan').textContent='offline'; return false; }
}
async function rescan(){ await api('/api/rescan', {method:'POST'}); toast('Rescan started'); pollScan(); }
let scanPoll;
function pollScan(){
  clearInterval(scanPoll);
  scanPoll = setInterval(async ()=>{ const running = await refreshHealth(); if(!running) clearInterval(scanPoll); }, 1500);
}

// ---------- upload ----------
async function uploadFiles(fileList){
  const files = [...fileList].filter(f=> f.type.startsWith('image/') || f.type.startsWith('video/'));
  if(!files.length){ toast('No image/video files'); return; }
  const fd = new FormData();
  files.forEach(f=> fd.append('file', f, f.name));
  toast(`Uploading ${files.length} file${files.length>1?'s':''}…`);
  try{
    const r = await fetch('/api/upload', {method:'POST', body:fd});
    if(!r.ok) throw {status:r.status};
    const data = await r.json();
    const ok = (data.items||[]).filter(i=>i.indexed).length;
    toast(`Uploaded ${ok}/${data.count} — added to library`);
    refreshHealth();
    // jump to Photos and reload so the new items show at the top
    switchView('photos');
  }catch(e){ toast('Upload failed ('+(e.status||e)+')'); }
  $('#fileInput').value = '';
}

// drag-and-drop anywhere on the window
let dragDepth = 0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; $('#dropzone').classList.add('on'); });
window.addEventListener('dragover', e=> e.preventDefault());
window.addEventListener('dragleave', e=>{ e.preventDefault(); if(--dragDepth<=0){ dragDepth=0; $('#dropzone').classList.remove('on'); } });
window.addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0; $('#dropzone').classList.remove('on');
  if(e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});

// ---------- scroll date badge ----------
let badgeTimer;
document.querySelector('main').addEventListener('scroll', ()=>{
  if($('#grid').style.display==='none') return;
  const mainBox = document.querySelector('main').getBoundingClientRect();
  const probe = document.elementFromPoint(mainBox.left + mainBox.width/2, mainBox.top + 90);
  const tile = probe && probe.closest ? probe.closest('.tile') : null;
  if(!tile) return;
  const ts = parseFloat(tile.dataset.ts);
  const b = $('#datebadge');
  if(ts){
    const d = new Date(ts*1000);
    if(isNaN(d)) return;
    b.textContent = d.toLocaleString(undefined, {month:'long', year:'numeric'});
  }else{
    b.textContent = 'Date unknown';
  }
  b.classList.add('on');
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(()=> b.classList.remove('on'), 1400);
}, {passive:true});

// ---------- infinite scroll ----------
io = new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting && ['photos','favorites','videos','trash','unknown-photos','unknown-videos'].includes(state.view)) loadGrid(false);
}, {rootMargin:'600px'});
io.observe($('#sentinel'));

// ---------- boot ----------
refreshHealth().then(r=>{ if(r) pollScan(); });
history.replaceState({view:'photos', params:{}}, '');
switchView('photos', {}, true);
</script>
